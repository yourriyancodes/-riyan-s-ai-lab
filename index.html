<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0e0c" />
    <meta
      name="description"
      content="Riyan Pasha — Tech King. A technologist and builder across AI, data, software, mobile, web, cloud and automation — an interactive 3D tech universe portfolio."

    <title>RIYAN PASHA — TECH KING · Technologist <title>Riyan Pasha — AI Product Engineer</title> Builder</title>
    <style>
      /* Boot splash shown before React mounts */
      #boot {
        position: fixed;
        inset: 0;
        background: #0a0e0c;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: ui-monospace, 'SF Mono', Menlo, monospace;
        color: #8ba598;
        letter-spacing: 0.35em;
        font-size: 12px;
        z-index: 999;
      }
      #boot .dot {
        width: 8px;
        height: 8px;
        border-radius: 9999px;
        background: #34d399;
        box-shadow: 0 0 18px #34d399;
        animation: bootpulse 1.1s ease-in-out infinite;
      }
      @keyframes bootpulse {
        0%, 100% { opacity: 0.25; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1.15); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="boot"><div class="dot"></div>INITIALIZING LAB</div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
